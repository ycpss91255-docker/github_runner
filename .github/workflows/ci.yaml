name: ci

on:
  push:
  pull_request:

env:
  TEST_TOOLS_IMAGE: ghcr.io/ycpss91255-docker/test-tools:latest

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: pull test-tools
        run: docker pull "${TEST_TOOLS_IMAGE}"
      - name: shellcheck
        run: make -f Makefile.ci lint

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: pull test-tools
        run: docker pull "${TEST_TOOLS_IMAGE}"
      - name: bats smoke
        run: make -f Makefile.ci test

  coverage:
    # Main-push only. kcov instrumentation is 2-5x slower than plain bats
    # (per base/self-test.yaml comment), so PRs run lint + test only and
    # main push picks up the coverage signal for Codecov.
    #
    # continue-on-error: coverage is a METRIC, never a gate. It runs in the
    # Debian kcov image (Makefile.ci's COVERAGE_IMAGE), which diverges from
    # the alpine test-tools image the `bats` job uses: a known subset of
    # source-the-script tests deterministically misbehaves under kcov's
    # ptrace in the full suite (they pass under `make test` and in
    # isolation). Per base/self-test.yaml, a coverage hiccup must never turn
    # the workflow — and therefore the CI badge — red, so the whole job is
    # allowed to fail without failing the run.
    continue-on-error: true
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: run kcov coverage
        run: make -f Makefile.ci coverage
      - name: upload to Codecov
        # fail_ci_if_error: false mirrors base/self-test.yaml — a Codecov
        # upload glitch (or a missing token on forks) must not fail the job.
        if: ${{ always() }}
        uses: codecov/codecov-action@v5
        with:
          directory: ./coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  ci-rollup:
    # Single aggregator that branch protection requires, mirroring base's
    # self-test.yaml ci-rollup. shellcheck + bats join this `needs:` list
    # so branch protection tracks one stable check name regardless of how
    # the sub-jobs are renamed or split later. `coverage` is intentionally
    # excluded: it is a main-push-only metric, not a PR gate, so a coverage
    # hiccup must never block a merge. SKIPPED folds into pass so future
    # conditionally-gated sub-jobs don't wedge doc-only PRs.
    needs: [shellcheck, bats]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify upstream jobs
        env:
          SHELLCHECK_RESULT: ${{ needs.shellcheck.result }}
          BATS_RESULT: ${{ needs.bats.result }}
        run: |
          set -euo pipefail
          echo "shellcheck: ${SHELLCHECK_RESULT}"
          echo "bats:       ${BATS_RESULT}"
          fail=0
          for r in "${SHELLCHECK_RESULT}" "${BATS_RESULT}"; do
            [[ "${r}" == "success" || "${r}" == "skipped" ]] || fail=1
          done
          exit "${fail}"
