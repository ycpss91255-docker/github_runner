name: ci

on:
  push:
  pull_request:

env:
  TEST_TOOLS_IMAGE: ghcr.io/ycpss91255-docker/test-tools:latest
  # Pin the Go toolchain image the listener build/vet/test job runs in, mirroring
  # the containerized command used locally (listener/go.mod's go 1.25.3). #129.
  GO_IMAGE: golang:1.25.3

# Least-privilege default token: this workflow only checks out, runs tests,
# and uploads coverage (via a repo secret, not the GITHUB_TOKEN). Read-only
# contents is all any job needs. #57.
permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      # `just lint` depends on the repo structure lints, one of which judges the
      # branch against its merge base with main, so this job needs the history
      # and the remote-tracking ref too. It fails closed on a base it cannot
      # resolve, so this is not optional.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: fetch the base branch
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: pull test-tools
        run: docker pull "${TEST_TOOLS_IMAGE}"
      - name: shellcheck
        run: just lint

  adr-lint:
    # ADR structure lint (doc/adr/). The adopted ADR spec is explicit that
    # self-discipline does not count, so this is a merge gate rather than a
    # review convention. It is pure bash + grep -- no test-tools image is
    # pulled -- so it is the cheapest job here, and it joins the ci-rollup
    # `needs:` list below so a drifting ADR blocks the merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: adr structure lint
        run: just lint-adr

  changelog-lint:
    # A change an operator can observe must carry a CHANGELOG entry. The rule
    # lived only in a local hook, so a push that never ran the hook was never
    # checked -- which is the same as not having the rule, because its failure
    # produced no signal. Needs the full history and a resolvable origin/main to
    # compute the merge base against, hence fetch-depth: 0 and the fetch below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      # A PR checkout carries no remote-tracking main, and the lint fails closed
      # on a base it cannot resolve rather than passing on nothing.
      - name: fetch the base branch
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: changelog entry lint
        run: just lint-changelog

  readme-sync-lint:
    # The four-language README structure. Hook-only until now, and a hook sees a
    # partial update only on the machine running it -- one that arrives across
    # two commits was invisible to it entirely.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: four-language README structure lint
        run: just lint-readme-sync

  doc-citation-lint:
    # No `file:line` citations and no hardcoded counts in the documentation.
    # Both are copies of what the tree already states, and a copy nothing checks
    # is exactly the drift invariant 3 exists to prevent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: documentation citation lint
        run: just lint-doc-citations

  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: pull test-tools
        run: docker pull "${TEST_TOOLS_IMAGE}"
      # The bash suite is layered (doc/test-levels.md). The levels run as two
      # steps of one job rather than as two jobs: the log then names the level
      # that broke, without a second image pull and without a second entry in
      # the ci-rollup needs list that branch protection tracks.
      - name: bats unit
        run: just test-unit
      - name: bats integration
        run: just test-integration

  go:
    # Containerized Go build + vet + test for the listener module (#129),
    # mirroring the command run locally:
    #   docker run --rm -v "$PWD:/src" -w /src golang:<ver> \
    #     sh -c 'go build ./... && go vet ./... && go test -race ./...'
    # Run inside the pinned golang image so CI matches the local toolchain
    # exactly; -race is the local idiom and catches data races in the
    # concurrent listen/provision loop. This job gates merges via ci-rollup.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: go build + vet + test (containerized)
        working-directory: listener
        run: |
          docker run --rm -v "$PWD:/src" -w /src "${GO_IMAGE}" \
            sh -c 'go build ./... && go vet ./... && go test -race ./...'
      - name: set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      # Exercise the actual release build recipe, not just `go build ./...`: the
      # recipe carries -trimpath/-ldflags/-buildvcs flags and its own container
      # invocation that plain `go build` does not, so a recipe regression (a bad
      # flag, a broken mount) is otherwise invisible until an operator deploys.
      - name: build the release listener binary (build-listener recipe)
        run: just build-listener
      # The Go coverage floor (PRD.md §0.4). Lives in this job because it needs
      # the same pinned toolchain image, and this job already gates merges. The
      # recipe excludes listener/cmd/ from the measurement: that entrypoint is
      # wiring, covered at the integration and system level instead.
      - name: go coverage floor (listener core)
        run: just coverage-go

  coverage:
    # Runs on every push and PR, and blocks the merge. It used to be advisory --
    # continue-on-error, main-push only, outside the ci-rollup needs list -- on
    # the grounds that the measurement was not reproducible: it apt-installed
    # bats inside the kcov container on every run, so it needed the network and
    # measured with whatever bats version the archive carried that day. That is
    # fixed: the recipe now runs a pinned, sha256-verified bats in a container
    # started with --network none, and the same command reproduces the number
    # on a maintainer's machine. A reproducible number can hold a line, so it
    # does -- see the floors in script/coverage-gate.sh.
    #
    # The cost is honest: kcov instrumentation is 2-5x slower than plain bats,
    # and PRs now pay it. That is what a gate costs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      # One recipe measures and enforces, so CI cannot drift from the local run.
      - name: run kcov coverage and enforce the bash floor
        run: just coverage-gate
      - name: upload to Codecov
        # fail_ci_if_error: false mirrors base/self-test.yaml — a Codecov
        # upload glitch (or a missing token on forks) must not fail the job.
        if: ${{ always() }}
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          directory: ./coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  ci-rollup:
    # Single aggregator that branch protection requires, mirroring base's
    # self-test.yaml ci-rollup. Every sub-job joins this `needs:` list so branch
    # protection tracks one stable check name regardless of how the sub-jobs are
    # renamed or split later. `coverage` used to be excluded on purpose, as a
    # main-push-only metric; it now carries the bash coverage floor, so leaving
    # it out would mean the floor could not fail a PR, which is the same as not
    # having one. The same reasoning admits the three structure lints: each was
    # enforced only by a local hook, and a rule that cannot fail a PR is only
    # half enforced. SKIPPED folds into pass so future conditionally-gated
    # sub-jobs don't wedge doc-only PRs.
    needs: [shellcheck, adr-lint, changelog-lint, readme-sync-lint, doc-citation-lint, bats, go, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify upstream jobs
        env:
          SHELLCHECK_RESULT: ${{ needs.shellcheck.result }}
          ADR_LINT_RESULT: ${{ needs['adr-lint'].result }}
          CHANGELOG_LINT_RESULT: ${{ needs['changelog-lint'].result }}
          README_SYNC_LINT_RESULT: ${{ needs['readme-sync-lint'].result }}
          DOC_CITATION_LINT_RESULT: ${{ needs['doc-citation-lint'].result }}
          BATS_RESULT: ${{ needs.bats.result }}
          GO_RESULT: ${{ needs.go.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          set -euo pipefail
          echo "shellcheck:         ${SHELLCHECK_RESULT}"
          echo "adr-lint:           ${ADR_LINT_RESULT}"
          echo "changelog-lint:     ${CHANGELOG_LINT_RESULT}"
          echo "readme-sync-lint:   ${README_SYNC_LINT_RESULT}"
          echo "doc-citation-lint:  ${DOC_CITATION_LINT_RESULT}"
          echo "bats:               ${BATS_RESULT}"
          echo "go:                 ${GO_RESULT}"
          echo "coverage:           ${COVERAGE_RESULT}"
          fail=0
          for r in "${SHELLCHECK_RESULT}" "${ADR_LINT_RESULT}" \
                   "${CHANGELOG_LINT_RESULT}" "${README_SYNC_LINT_RESULT}" \
                   "${DOC_CITATION_LINT_RESULT}" "${BATS_RESULT}" \
                   "${GO_RESULT}" "${COVERAGE_RESULT}"; do
            [[ "${r}" == "success" || "${r}" == "skipped" ]] || fail=1
          done
          exit "${fail}"
